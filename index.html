    :root {

      --primary: #d4af37;
      --primary-soft: rgba(212, 175, 55, 0.18);
      --accent: #9d4edd;
      --text: #f0f0f5;
      --text-secondary: #b8b8d0;
      --text-tertiary: #9090a8;
      --danger: #ff6b6b;
      --success: #34d399;
      --bg-image: none;
      --bg-overlay: 0.6;
    }

    * { -webkit-tap-highlight-color: transparent; }

    html, body {
      background: var(--bg);
      color: var(--text);

      overflow-x: hidden;
      min-height: 100vh;
      min-height: 100dvh;
    }

      background-image: var(--bg-image);
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background: rgba(10, 10, 15, var(--bg-overlay));
      pointer-events: none;
      z-index: 0;
    }

    .font-display { font-family: 'Cinzel', 'Tajawal', serif; }
    .font-body { font-family: 'Outfit', 'Cairo', sans-serif; }
    .font-mono { font-family: 'JetBrains Mono', monospace; }

    /* Aurora animated background */
    .aurora-bg {
      position: fixed;
      inset: 0;
      z-index: 0;
      overflow: hidden;
      pointer-events: none;
    }
    .aurora-bg::before, .aurora-bg::after {
      content: '';
      position: absolute;
      width: 60vmax;
      height: 60vmax;
      border-radius: 50%;
      filter: blur(100px);
      opacity: 0.35;
      animation: aurora 20s ease-in-out infinite alternate;
    }
    .aurora-bg::before {
      background: radial-gradient(circle, var(--primary) 0%, transparent 65%);
      top: -20%;
      left: -10%;
    }
    .aurora-bg::after {
      background: radial-gradient(circle, var(--accent) 0%, transparent 65%);
      bottom: -20%;
      right: -10%;
      animation-delay: -10s;
    }
    @keyframes aurora {
      0%   { transform: translate(0, 0) rotate(0deg) scale(1); }
      50%  { transform: translate(5%, 8%) rotate(180deg) scale(1.15); }
      100% { transform: translate(-5%, -3%) rotate(360deg) scale(0.95); }
    }

    /* Particles */
    .particles { position: fixed; inset: 0; z-index: 0; pointer-events: none; }
    .particle {
      position: absolute;
      width: 3px; height: 3px;
      background: var(--primary);
      border-radius: 50%;
      opacity: 0.6;
      animation: float 12s linear infinite;
    }
    @keyframes float {
      0%   { transform: translateY(110vh) translateX(0); opacity: 0; }
      10%  { opacity: 0.7; }
      90%  { opacity: 0.7; }
      100% { transform: translateY(-10vh) translateX(40px); opacity: 0; }
    }

    /* Grain overlay */
    .grain {
      position: fixed; inset: 0; z-index: 1; pointer-events: none;
      opacity: 0.04; mix-blend-mode: overlay;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
    }

    /* Buttons */
    .btn-primary {
      background: var(--primary);
      color: #0a0a0f;
      font-weight: 600;
      letter-spacing: 0.02em;
      transition: transform 150ms cubic-bezier(0.4,0,0.2,1), box-shadow 150ms cubic-bezier(0.4,0,0.2,1), opacity 150ms;
    }
    .btn-primary:hover { transform: translateY(-1px); box-shadow: 0 8px 24px var(--primary-soft); }
    .btn-primary:active { transform: translateY(0) scale(0.98); }

    .btn-ghost {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text);
      transition: all 150ms cubic-bezier(0.4,0,0.2,1);
    }
    .btn-ghost:hover { border-color: var(--primary); background: var(--primary-soft); }

    .btn-danger { background: var(--danger); color: white; transition: all 150ms; }
    .btn-danger:hover { opacity: 0.9; transform: translateY(-1px); }

    /* Card */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 18px;
      backdrop-filter: blur(12px);
    }

    /* Input */
    .input {
      background: rgba(0,0,0,0.3);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px 16px;
      color: var(--text);
      font-family: inherit;
      width: 100%;
      transition: border-color 150ms, background 150ms;
    }
    .input:focus {
      outline: none;
      border-color: var(--primary);
      background: rgba(0,0,0,0.4);
    }
    .input::placeholder { color: var(--text-tertiary); }

    /* Link card hover */
    .link-card {
      transition: transform 180ms cubic-bezier(0.4,0,0.2,1), background 180ms, border-color 180ms;
      will-change: transform;
    }
    .link-card:hover { transform: translateY(-2px); border-color: var(--primary); background: rgba(212,175,55,0.06); }
    .link-card:active { transform: translateY(0) scale(0.98); }

    /* Avatar */
    .avatar-ring {
      position: relative;
      border-radius: 50%;
      padding: 4px;
      background: conic-gradient(from 0deg, var(--primary), var(--accent), var(--primary));
      animation: rotate 8s linear infinite;
    }
    @keyframes rotate { to { transform: rotate(360deg); } }
    .avatar-inner {
      background: var(--bg);
      border-radius: 50%;
      padding: 4px;
      animation: rotate 8s linear infinite reverse;
    }
    .avatar-img {
      width: 100%; height: 100%;
      border-radius: 50%;
      object-fit: cover;
      cursor: pointer;
      user-select: none;
    }
    .avatar-img:active { transform: scale(0.96); transition: transform 80ms; }

    /* Fade in */
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(8px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .fade-up {
      animation: fadeUp 400ms cubic-bezier(0.16, 1, 0.3, 1) both;
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to   { opacity: 1; }
    }
    .fade-in { animation: fadeIn 300ms ease both; }

    /* Modal */
    .modal-overlay {
      position: fixed; inset: 0;
      background: rgba(0,0,0,0.75);
      backdrop-filter: blur(8px);
      z-index: 100;
      animation: fadeIn 200ms ease;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    .modal-content {
      animation: modalIn 280ms cubic-bezier(0.16, 1, 0.3, 1);
    }
    @keyframes modalIn {
      from { opacity: 0; transform: scale(0.92) translateY(12px); }
      to   { opacity: 1; transform: scale(1) translateY(0); }
    }

    /* Scrollbar */
    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--surface-2); border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--primary-soft); }

    /* Tabs */
    .tab {
      padding: 10px 16px;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 500;
      transition: all 150ms;
      cursor: pointer;
      color: var(--text-secondary);
      white-space: nowrap;
    }
    .tab:hover { color: var(--text); background: var(--surface-2); }
    .tab.active { background: var(--primary); color: #0a0a0f; }

    /* Spinner */
    .spinner {
      width: 28px; height: 28px;
      border: 2px solid var(--border);
      border-top-color: var(--primary);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Reduce motion */
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
      .avatar-ring, .avatar-inner { animation: none; }
    }

    [dir="rtl"] .font-display { font-family: 'Tajawal', 'Cinzel', serif; }

    .theme-swatch {
      cursor: pointer;
      border: 2px solid transparent;
      border-radius: 14px;
      padding: 12px;
      transition: all 150ms;
      position: relative;
      overflow: hidden;
    }
    .theme-swatch.active {
      border-color: var(--primary);
      box-shadow: 0 0 0 2px var(--primary-soft);
    }
    .theme-swatch:hover { transform: translateY(-2px); }

    /* Music orb */
    .music-orb {
      position: fixed;
      bottom: 24px;
      right: 24px;
      z-index: 50;
      width: 52px; height: 52px;
      border-radius: 50%;
      background: var(--surface);
      border: 1px solid var(--border);
      backdrop-filter: blur(20px);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: transform 180ms cubic-bezier(0.4,0,0.2,1);
    }
    .music-orb:hover { transform: scale(1.08); border-color: var(--primary); }
    .music-orb svg { color: var(--primary); }
    .music-orb.playing::after {
      content: '';
      position: absolute;
      inset: -4px;
      border-radius: 50%;
      border: 2px solid var(--primary);
      opacity: 0.4;
      animation: pulse 2s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 0.4; }
      50%      { transform: scale(1.15); opacity: 0; }
    }

    /* Snackbar */
    .snackbar {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      background: var(--surface);
      border: 1px solid var(--border);
      padding: 12px 20px;
      border-radius: 12px;
      z-index: 200;
      animation: fadeUp 250ms ease;
      box-shadow: 0 8px 32px rgba(0,0,0,0.4);
    }

    /* Hide number input arrows */
    input[type=number]::-webkit-inner-spin-button,
    input[type=number]::-webkit-outer-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }

    /* Focus visible */
    *:focus { outline: none; }
    *:focus-visible {
      outline: 2px solid var(--primary);
      outline-offset: 3px;
      border-radius: 4px;
    }

    .skip-link {
      position: absolute;
      left: -9999px;
      top: 0;
      z-index: 999;
      background: var(--primary);
      color: var(--bg);
      padding: 12px 20px;
      border-radius: 0 0 12px 0;
      font-weight: 600;
      font-size: 14px;
    }
    .skip-link:focus { left: 0; }

    /* Visually hidden (for screen reader text) */
    .sr-only {
      position: absolute;
      width: 1px; height: 1px;
      padding: 0; margin: -1px;
      overflow: hidden;
      clip: rect(0,0,0,0);
      white-space: nowrap;
      border: 0;
    }
  </style>
</head>

function applyTheme(themeObj) {
  if (!themeObj) return;
  const r = document.documentElement;
  r.style.setProperty('--bg', themeObj.bg);
  r.style.setProperty('--surface', themeObj.surface);
  r.style.setProperty('--surface-2', themeObj.surface2);
  r.style.setProperty('--primary', themeObj.primary);
  r.style.setProperty('--accent', themeObj.accent);
  r.style.setProperty('--text', themeObj.text);
  r.style.setProperty('--text-secondary', themeObj.textSecondary);
  r.style.setProperty('--text-tertiary', themeObj.textTertiary);
  r.style.setProperty('--border', themeObj.border);
  r.style.setProperty('--primary-soft', themeObj.primarySoft);
}

function applyBackground(bgImage, overlay) {
  const r = document.documentElement;
  r.style.setProperty('--bg-image', bgImage ? `url("${bgImage}")` : 'none');
  r.style.setProperty('--bg-overlay', overlay != null ? overlay : 0.6);
}

// ============================================================================
// MAIN APP
// ============================================================================
function App() {
  const [config, setConfig] = useState(null);
  const [loading, setLoading] = useState(true);
  const [error, setError] = useState(null);
  const [hasEntered, setHasEntered] = useState(false);
  const [isDashboard, setIsDashboard] = useState(false);
  const [showCodeModal, setShowCodeModal] = useState(false);
  const [toast, setToast] = useState(null);

  const toastTimer = useRef(null);
  const showToast = useCallback((msg) => {
    setToast(msg);
    clearTimeout(toastTimer.current);
    toastTimer.current = setTimeout(() => setToast(null), 2600);
  }, []);

  // Load + subscribe (with hard timeout so the UI never stalls on Firebase issues)
  useEffect(() => {
    let settled = false;
    const finish = (cfg) => {
      if (settled) return;
      settled = true;
      setConfig(cfg);
      setLoading(false);
    };

    let fallback = DEFAULT_CONFIG;
    try {
      const local = localStorage.getItem('gnmc_config');
      if (local) fallback = { ...DEFAULT_CONFIG, ...JSON.parse(local) };
    } catch (_) {}

    const timer = setTimeout(() => {
      if (!settled) {
        console.warn('[gnmc] Firestore timeout (2.5s) — rendering with local/default config');
        setError('offline');
        finish(fallback);
      }
    }, 2500);

    let unsub = () => {};
    try {
      unsub = CONFIG_DOC.onSnapshot(
        (snap) => {
          clearTimeout(timer);
          if (snap.exists) {
            const data = snap.data();
            finish({
              ...DEFAULT_CONFIG, ...data,
              profile: { ...DEFAULT_CONFIG.profile, ...(data.profile||{}) },
              audio:   { ...DEFAULT_CONFIG.audio,   ...(data.audio||{}) },
              theme:   { ...DEFAULT_CONFIG.theme,   ...(data.theme||{}) },
              auth:    { ...DEFAULT_CONFIG.auth,    ...(data.auth||{}) }
            });
          } else {
            CONFIG_DOC.set(DEFAULT_CONFIG).catch(()=>{});
            finish(DEFAULT_CONFIG);
          }
        },
        (err) => {
          clearTimeout(timer);
          console.warn('[gnmc] firestore error → fallback local', err);
          setError('offline');
          finish(fallback);
        }
      );
    } catch (err) {
      clearTimeout(timer);
      console.error('[gnmc] firebase init failed', err);
      setError('offline');
      finish(fallback);
    }

    return () => { clearTimeout(timer); try { unsub(); } catch (_) {} };
  }, []);

  // Apply theme + background
  useEffect(() => {
    if (!config) return;
    const themeKey = config.theme.preset;
    const themeObj = themeKey === 'custom' && config.theme.custom
      ? config.theme.custom
      : THEMES[themeKey] || THEMES.midnight_galaxy;
    applyTheme(themeObj);
    applyBackground(config.theme.backgroundImage, config.theme.backgroundOverlay);
  }, [config?.theme]);

  // Save helper
  const saveConfig = useCallback(async (updates) => {
    const newConfig = typeof updates === 'function' ? updates(config) : { ...config, ...updates };
    setConfig(newConfig);
    localStorage.setItem('gnmc_config', JSON.stringify(newConfig));
    try {
      await CONFIG_DOC.set(newConfig, { merge: true });
    } catch (err) {
      console.warn('save failed', err);
      showToast('Saved locally (offline)');
    }
  }, [config, showToast]);

  const handleCodeSubmit = useCallback(async (code) => {
    const hash = await sha256(code);
    if (hash === (config?.auth?.passwordHash || DEFAULT_PASSWORD_HASH)) {
      setIsDashboard(true);
      setShowCodeModal(false);
      showToast('Welcome back');
      return true;
    }
    return false;
  }, [config, showToast]);

  if (loading) {
    return (
      <div role="status" aria-live="polite" aria-label="Loading site" className="fixed inset-0 flex items-center justify-center flex-col gap-4">
        <div className="spinner" aria-hidden="true"></div>
        <div className="font-display text-xs tracking-[0.4em] uppercase" style={{ color: 'var(--text-secondary)' }}>loading</div>
      </div>
    );
  }

  return (
    <>
      <BackgroundLayer effect={config.theme.backgroundEffect} />
      <div className="grain"></div>

      <div className="relative z-10">
        {!hasEntered ? (
          <EntryOverlay
            config={config}
            onEnter={() => setHasEntered(true)}
          />
        ) : isDashboard ? (
          <Dashboard
            config={config}
            saveConfig={saveConfig}
            showToast={showToast}
            onExit={() => setIsDashboard(false)}
          />
        ) : (
          <PublicProfile
            config={config}
            onSecretTrigger={() => setShowCodeModal(true)}
          />
        )}
      </div>

      {hasEntered && !isDashboard && config.audio.backgroundUrl && (
        <BackgroundAudio
          src={config.audio.backgroundUrl}
          volume={config.audio.volume}
          loop={config.audio.loop}
        />
      )}

      {showCodeModal && (
        <CodeModal
          onClose={() => setShowCodeModal(false)}
          onSubmit={handleCodeSubmit}
        />
      )}

      <div role="status" aria-live="polite" aria-atomic="true" className="sr-only">
        {toast || ''}
      </div>
      {toast && (
        <div className="snackbar text-sm" aria-hidden="true">{toast}</div>
      )}
    </>
  );
}

// ============================================================================
// BACKGROUND LAYER
// ============================================================================
function BackgroundLayer({ effect }) {
  if (effect === 'none') return null;
  if (effect === 'particles') {
    return (
      <div className="particles">
        {Array.from({ length: 28 }).map((_, i) => (
          <div
            key={i}
            className="particle"
            style={{
              left: `${(i * 3.6) % 100}%`,
              animationDelay: `${(i * 0.4) % 12}s`,
              animationDuration: `${10 + (i % 6)}s`
            }}
          />
        ))}
      </div>
    );
  }
  return <div className="aurora-bg"></div>;
}

// ============================================================================
// BACKGROUND AUDIO
// ============================================================================
function BackgroundAudio({ src, volume, loop }) {
  const ref = useRef(null);
  useEffect(() => {
    if (!ref.current) return;
    ref.current.volume = volume ?? 0.4;
    ref.current.play().catch(() => {});
  }, [src, volume]);
  return <audio ref={ref} src={src} loop={loop !== false} autoPlay />;
}

// ============================================================================
// ENTRY OVERLAY (click to enter — solves autoplay restriction)
// ============================================================================
function EntryOverlay({ config, onEnter }) {
  useEffect(() => {
    const onKey = (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); onEnter(); } };
    document.addEventListener('keydown', onKey);
    return () => document.removeEventListener('keydown', onKey);
  }, [onEnter]);

  return (
    <button
      type="button"
      className="fixed inset-0 flex items-center justify-center fade-in"
      style={{ zIndex: 40, background: 'transparent', border: 'none', cursor: 'pointer', width: '100vw', height: '100dvh' }}

// ============================================================================
// SECRET CODE MODAL
// ============================================================================
function CodeModal({ onClose, onSubmit }) {
  const [code, setCode] = useState('');
  const [error, setError] = useState(false);
  const [submitting, setSubmitting] = useState(false);
  const inputRef = useRef(null);
  const previousFocus = useRef(null);

  useEffect(() => {
    previousFocus.current = document.activeElement;
    inputRef.current?.focus();
    const onKey = (e) => { if (e.key === 'Escape') onClose(); };
    document.addEventListener('keydown', onKey);
    return () => {
      document.removeEventListener('keydown', onKey);
      previousFocus.current?.focus?.();
    };
  }, [onClose]);

  const handleSubmit = async (e) => {
    e.preventDefault();
    if (!code.trim()) return;
    setSubmitting(true);
    setError(false);
    const ok = await onSubmit(code);
    if (!ok) {
      setError(true);
      setCode('');
      setSubmitting(false);
      inputRef.current?.focus();
      setTimeout(() => setError(false), 600);
    }
  };

  return (
    <div className="modal-overlay" onClick={onClose}>
      <div
        role="dialog"
        aria-modal="true"
        aria-labelledby="code-modal-title"
        aria-describedby="code-modal-desc"
        className="modal-content card p-7 w-full max-w-sm"
        onClick={(e) => e.stopPropagation()}
        style={{ animation: error ? 'shake 0.4s' : undefined }}
      >
        <style>{`@keyframes shake { 0%,100%{transform:translateX(0)} 25%{transform:translateX(-6px)} 75%{transform:translateX(6px)} }`}</style>

        <div className="flex items-center gap-3 mb-2">
          <div style={{ color: 'var(--primary)' }}><Icon name="lock" size={22} /></div>
          <h2 id="code-modal-title" className="font-display text-lg" style={{ color: 'var(--text)' }}>secret</h2>
        </div>
        <p id="code-modal-desc" className="text-xs mb-5" style={{ color: 'var(--text-secondary)' }}>
          enter the secret code
        </p>

        <form onSubmit={handleSubmit}>
          <label htmlFor="secret-code-input" className="sr-only">Secret code</label>
          <input
            id="secret-code-input"
            ref={inputRef}
            type="password"
            inputMode="numeric"
            autoComplete="off"
            value={code}
            onChange={(e) => setCode(e.target.value)}
            placeholder="••••"
            className="input font-mono text-center text-2xl tracking-[0.5em]"
            aria-invalid={error}
            aria-describedby={error ? 'secret-error' : undefined}
            style={{ borderColor: error ? 'var(--danger)' : undefined }}
          />
          {error && (
            <p id="secret-error" role="alert" className="text-xs mt-2 text-center" style={{ color: 'var(--danger)' }}>
              Wrong code, try again
            </p>
          )}
          <div className="flex gap-2 mt-5">
            <button type="button" onClick={onClose} className="btn-ghost flex-1 py-3 rounded-xl text-sm font-medium">
              cancel
            </button>
            <button type="submit" disabled={submitting} className="btn-primary flex-1 py-3 rounded-xl text-sm">
              {submitting ? 'checking…' : 'enter'}
            </button>
          </div>
        </form>
      </div>
    </div>
  );
}

      const url = await snap.ref.getDownloadURL();
      setDraft(d => ({ ...d, avatar: url }));

  const addLink = () => {
    setLinks([...links, { id: uid(), type: 'tiktok', label: '', url: '' }]);
  };
  const updateLink = (id, patch) => {
    setLinks(links.map(l => l.id === id ? { ...l, ...patch } : l));
  };
  const removeLink = (id) => {
    setLinks(links.filter(l => l.id !== id));
  };
  const move = (idx, dir) => {
    const next = [...links];
    const target = idx + dir;
    if (target < 0 || target >= next.length) return;
    [next[idx], next[target]] = [next[target], next[idx]];
    setLinks(next);
  };

  const save = async () => {
    await saveConfig({ links });
    showToast('Links saved');
  };

    <div className="card p-6 space-y-4">

                />
                <div className="flex gap-1">
                  <button type="button" onClick={() => move(idx, -1)} disabled={idx === 0} className="btn-ghost w-9 h-9 rounded-lg flex items-center justify-center disabled:opacity-40" aria-label={`Move ${preset.label} link up`}>
                    <svg width="14" height="14" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 15l7-7 7 7" stroke="currentColor" strokeWidth="2" fill="none" strokeLinecap="round"/></svg>
                  </button>
                  <button type="button" onClick={() => move(idx, 1)} disabled={idx === links.length - 1} className="btn-ghost w-9 h-9 rounded-lg flex items-center justify-center disabled:opacity-40" aria-label={`Move ${preset.label} link down`}>
                    <svg width="14" height="14" viewBox="0 0 24 24" aria-hidden="true"><path d="M19 9l-7 7-7-7" stroke="currentColor" strokeWidth="2" fill="none" strokeLinecap="round"/></svg>
                  </button>
                  <button type="button" onClick={() => removeLink(link.id)} className="btn-ghost w-9 h-9 rounded-lg flex items-center justify-center" style={{ color: 'var(--danger)' }} aria-label={`Delete ${preset.label} link`}>
                    <Icon name="trash" size={14} />
                  </button>
                </div>
              </div>
              <label htmlFor={urlId} className="sr-only">URL for {preset.label}</label>
              <input
                id={urlId}
                className="input"
                value={link.url}
                onChange={(e) => updateLink(link.id, { url: e.target.value })}
                placeholder={preset.placeholder}
                type="url"
              />
            </li>
          );
        })}
      </ul>

      <div className="flex justify-end pt-2">
        <button type="button" onClick={save} className="btn-primary px-6 py-2.5 rounded-xl text-sm">Save links</button>
      </div>
    </div>
  );
}

// ----------------------------------------------------------------------------
// THEMES TAB
// ----------------------------------------------------------------------------
function ThemesTab({ config, saveConfig, showToast }) {
  const [theme, setTheme] = useState(config.theme);
  const [uploading, setUploading] = useState(false);

  useEffect(() => { setTheme(config.theme); }, [config.theme]);

  const applyAndSave = async (next) => {
    setTheme(next);
    await saveConfig({ theme: next });
    showToast('Theme applied');
  };

  const uploadBg = async (file) => {
    if (!file) return;
    setUploading(true);
    try {
      const path = `backgrounds/${Date.now()}_${file.name}`;
      const snap = await storage.ref(path).put(file);
      const url = await snap.ref.getDownloadURL();
      await applyAndSave({ ...theme, backgroundImage: url });
    } catch (e) {
      console.error(e);
      showToast('Upload failed');
    }
    setUploading(false);
  };

  return (
    <div className="space-y-5">
      <div className="card p-6">
        <h2 className="font-display text-xl mb-4" style={{ color: 'var(--primary)' }}>Theme Presets</h2>
        <div role="radiogroup" aria-label="Choose a theme preset" className="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-5 gap-3">
          {Object.entries(THEMES).map(([key, t]) => (
            <button
              type="button"
              key={key}
              role="radio"
              aria-checked={theme.preset === key}
              className={`theme-swatch text-left ${theme.preset === key ? 'active' : ''}`}
              style={{ background: t.bg, border: theme.preset === key ? `2px solid ${t.primary}` : `2px solid transparent` }}
              onClick={() => applyAndSave({ ...theme, preset: key })}
            >
              <div className="flex gap-1 mb-2" aria-hidden="true">
                <div style={{ width: 14, height: 14, borderRadius: 4, background: t.primary }} />
                <div style={{ width: 14, height: 14, borderRadius: 4, background: t.accent }} />
                <div style={{ width: 14, height: 14, borderRadius: 4, background: t.surface }} />
              </div>
              <div className="text-xs font-medium" style={{ color: t.text }}>{t.name}</div>
            </button>
          ))}
        </div>
      </div>

      <CustomThemeEditor
        theme={theme}
        onApply={(custom) => applyAndSave({ ...theme, preset: 'custom', custom })}
        isActive={theme.preset === 'custom'}
      />

      <div className="card p-6 space-y-4">
        <h2 className="font-display text-xl" style={{ color: 'var(--primary)' }}>Background</h2>
        <div>
          <div id="bg-effect-label" className="block text-xs uppercase tracking-wider mb-2" style={{ color: 'var(--text-tertiary)' }}>Effect</div>
          <div role="radiogroup" aria-labelledby="bg-effect-label" className="flex gap-2 flex-wrap">
            {['aurora', 'particles', 'none'].map(eff => (
              <button
                type="button"
                key={eff}
                role="radio"
                aria-checked={theme.backgroundEffect === eff}
                onClick={() => applyAndSave({ ...theme, backgroundEffect: eff })}
                className={`px-4 py-2 rounded-lg text-sm ${theme.backgroundEffect === eff ? 'btn-primary' : 'btn-ghost'}`}
              >
                {eff}
              </button>
            ))}
          </div>
        </div>
        <div>
          <label htmlFor="bg-image-url" className="block text-xs uppercase tracking-wider mb-2" style={{ color: 'var(--text-tertiary)' }}>Background image URL</label>
          <div className="flex gap-2">
            <input
              id="bg-image-url"
              className="input"
              value={theme.backgroundImage || ''}
              onChange={(e) => setTheme({ ...theme, backgroundImage: e.target.value })}
              placeholder="https://... or upload"
              type="url"
            />
            <label className="btn-ghost px-4 rounded-xl text-sm cursor-pointer flex items-center gap-2 whitespace-nowrap">
              <Icon name="upload" size={14} /> <span>{uploading ? 'uploading…' : 'upload'}</span>
              <input type="file" accept="image/*" className="sr-only" aria-label="Upload background image" onChange={(e) => uploadBg(e.target.files?.[0])} />
            </label>
          </div>
        </div>
        <div>
          <label htmlFor="bg-overlay" className="block text-xs uppercase tracking-wider mb-2" style={{ color: 'var(--text-tertiary)' }}>
            Overlay darkness <span className="ml-2 font-mono" style={{ color: 'var(--text-secondary)' }}>{Math.round((theme.backgroundOverlay ?? 0.6) * 100)}%</span>
          </label>
          <input
            id="bg-overlay"
            type="range"
            min="0" max="1" step="0.05"
            value={theme.backgroundOverlay ?? 0.6}
            onChange={(e) => setTheme({ ...theme, backgroundOverlay: parseFloat(e.target.value) })}
            className="w-full"
            style={{ accentColor: 'var(--primary)' }}
            aria-valuetext={`${Math.round((theme.backgroundOverlay ?? 0.6) * 100)} percent`}
          />
        </div>
        <div className="flex justify-end gap-2">
          {theme.backgroundImage && (
            <button type="button" onClick={() => applyAndSave({ ...theme, backgroundImage: '' })} className="btn-ghost px-4 py-2 rounded-xl text-sm">
              Remove image
            </button>
          )}
          <button type="button" onClick={() => applyAndSave(theme)} className="btn-primary px-6 py-2 rounded-xl text-sm">Apply</button>
        </div>
      </div>
    </div>
  );
}

function CustomThemeEditor({ theme, onApply, isActive }) {
  const init = theme.custom || THEMES.midnight_galaxy;
  const [custom, setCustom] = useState({
    ...init,
    name: init.name || 'Custom'
  });

  const fields = [
    { key: 'bg', label: 'Background' },
    { key: 'surface', label: 'Surface' },
    { key: 'surface2', label: 'Surface 2' },
    { key: 'primary', label: 'Primary' },
    { key: 'accent', label: 'Accent' },
    { key: 'text', label: 'Text' },
    { key: 'textSecondary', label: 'Text Secondary' }
  ];

  const handleApply = () => {
    const derived = {
      ...custom,
      textTertiary: custom.textTertiary || custom.textSecondary,
      border: `${custom.primary}1f`,
      primarySoft: `${custom.primary}26`
    };
    onApply(derived);
  };

  return (
    <div className={`card p-6 ${isActive ? '' : ''}`}>
      <div className="flex items-center justify-between mb-4">
        <h2 className="font-display text-xl" style={{ color: 'var(--primary)' }}>Custom Theme</h2>
        {isActive && <span className="text-xs px-2 py-1 rounded" style={{ background: 'var(--primary)', color: 'var(--bg)' }}>active</span>}
      </div>
      <div className="grid grid-cols-2 sm:grid-cols-3 gap-3 mb-4">
        {fields.map(f => {
          const colorId = `custom-${f.key}-color`;
          const hexId = `custom-${f.key}-hex`;
          return (
            <div key={f.key}>
              <label htmlFor={colorId} className="block text-xs mb-1" style={{ color: 'var(--text-tertiary)' }}>{f.label}</label>
              <div className="flex gap-2 items-center">
                <input
                  id={colorId}
                  type="color"
                  value={custom[f.key] || '#000000'}
                  onChange={(e) => setCustom({ ...custom, [f.key]: e.target.value })}
                  className="w-10 h-10 rounded cursor-pointer"
                  style={{ background: 'transparent', border: '1px solid var(--border)' }}
                  aria-label={`${f.label} color picker`}
                />
                <label htmlFor={hexId} className="sr-only">{f.label} hex code</label>
                <input
                  id={hexId}
                  className="input font-mono text-xs"
                  value={custom[f.key] || ''}
                  onChange={(e) => setCustom({ ...custom, [f.key]: e.target.value })}
                  placeholder="#000000"
                />
              </div>
            </div>
          );
        })}
      </div>
      <div className="flex justify-end">
        <button type="button" onClick={handleApply} className="btn-primary px-6 py-2 rounded-xl text-sm">
          Apply custom
        </button>
      </div>
    </div>
  );
}

// ----------------------------------------------------------------------------
// AUDIO TAB
// ----------------------------------------------------------------------------
function AudioTab({ config, saveConfig, showToast }) {
  const [audio, setAudio] = useState(config.audio);
  const [uploading, setUploading] = useState(null);
  const previewRef = useRef(null);

  useEffect(() => { setAudio(config.audio); }, [config.audio]);

  const uploadAudio = async (file, key) => {
    if (!file) return;
    setUploading(key);
    try {
      const path = `audio/${Date.now()}_${file.name}`;
      const snap = await storage.ref(path).put(file);
      const url = await snap.ref.getDownloadURL();
      setAudio(a => ({ ...a, [key]: url }));
      showToast('Audio uploaded');
    } catch (e) {
      console.error(e);
      showToast('Upload failed');
    }
    setUploading(null);
  };

  const save = async () => {
    await saveConfig({ audio });
    showToast('Audio settings saved');
  };

  return (
    <div className="card p-6 space-y-5">
      <h2 className="font-display text-xl mb-2" style={{ color: 'var(--primary)' }}>Audio</h2>

      <div className="space-y-4">
        <div>
          <label htmlFor="audio-bg-url" className="block text-xs uppercase tracking-wider mb-2" style={{ color: 'var(--text-tertiary)' }}>Background music URL</label>
          <div className="flex gap-2 mb-2">
            <input
              id="audio-bg-url"
              className="input"
              value={audio.backgroundUrl || ''}
              onChange={(e) => setAudio({ ...audio, backgroundUrl: e.target.value })}
              placeholder="https://... .mp3"
              type="url"
            />
            <label className="btn-ghost px-4 rounded-xl text-sm cursor-pointer flex items-center gap-2 whitespace-nowrap">
              <Icon name="upload" size={14} /> <span>{uploading === 'backgroundUrl' ? 'uploading…' : 'upload'}</span>
              <input type="file" accept="audio/*" className="sr-only" aria-label="Upload background music file" onChange={(e) => uploadAudio(e.target.files?.[0], 'backgroundUrl')} />
            </label>
          </div>
          {audio.backgroundUrl && (
            <audio ref={previewRef} src={audio.backgroundUrl} controls className="w-full" style={{ borderRadius: 8 }} aria-label="Background music preview" />
          )}
        </div>

        <div className="grid sm:grid-cols-2 gap-4">
          <div>
            <label htmlFor="audio-volume" className="block text-xs uppercase tracking-wider mb-2" style={{ color: 'var(--text-tertiary)' }}>
              Volume <span className="ml-2 font-mono" style={{ color: 'var(--text-secondary)' }}>{Math.round((audio.volume ?? 0.4) * 100)}%</span>
            </label>
            <input
              id="audio-volume"
              type="range" min="0" max="1" step="0.05"
              value={audio.volume ?? 0.4}
              onChange={(e) => setAudio({ ...audio, volume: parseFloat(e.target.value) })}
              className="w-full"
              style={{ accentColor: 'var(--primary)' }}
              aria-valuetext={`${Math.round((audio.volume ?? 0.4) * 100)} percent`}
            />
          </div>
          <div className="space-y-2">
            <label className="flex items-center gap-3 cursor-pointer" style={{ minHeight: 24 }}>
              <input
                type="checkbox"
                checked={audio.autoplay !== false}
                onChange={(e) => setAudio({ ...audio, autoplay: e.target.checked })}
                style={{ accentColor: 'var(--primary)', width: 18, height: 18 }}
              />
              <span className="text-sm">Autoplay after entry</span>
            </label>
            <label className="flex items-center gap-3 cursor-pointer" style={{ minHeight: 24 }}>
              <input
                type="checkbox"
                checked={audio.loop !== false}
                onChange={(e) => setAudio({ ...audio, loop: e.target.checked })}
                style={{ accentColor: 'var(--primary)', width: 18, height: 18 }}
              />
              <span className="text-sm">Loop</span>
            </label>
          </div>
        </div>

        <div className="text-xs pt-2 border-t" style={{ borderColor: 'var(--border)', color: 'var(--text-tertiary)' }}>
          Browsers block autoplay until the user clicks once — the "click to enter" overlay handles that.
        </div>
      </div>

      <div className="flex justify-end">
        <button type="button" onClick={save} className="btn-primary px-6 py-2.5 rounded-xl text-sm">Save audio</button>
      </div>
    </div>
  );
}

// ----------------------------------------------------------------------------
// SETTINGS TAB
// ----------------------------------------------------------------------------
function SettingsTab({ config, saveConfig, showToast }) {
  const [current, setCurrent] = useState('');
  const [next, setNext] = useState('');
  const [confirmCode, setConfirmCode] = useState('');
  const [busy, setBusy] = useState(false);

  const changePassword = async (e) => {
    e.preventDefault();
    if (next.length < 3) return showToast('Code too short (min 3 chars)');
    if (next !== confirmCode) return showToast('Codes do not match');
    setBusy(true);
    const curHash = await sha256(current);
    if (curHash !== (config.auth?.passwordHash || DEFAULT_PASSWORD_HASH)) {
      showToast('Current code is wrong');
      setBusy(false);
      return;
    }
    const newHash = await sha256(next);
    await saveConfig({ auth: { passwordHash: newHash } });
    setCurrent(''); setNext(''); setConfirmCode('');
    showToast('Code changed');
    setBusy(false);
  };

  const exportData = () => {
    const blob = new Blob([JSON.stringify(config, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `gnmc-backup-${new Date().toISOString().slice(0,10)}.json`;
    a.click();
    URL.revokeObjectURL(url);
  };

  return (
    <div className="space-y-5">
      <div className="card p-6 space-y-4">
        <h2 className="font-display text-xl" style={{ color: 'var(--primary)' }}>Change secret code</h2>
        <form onSubmit={changePassword} className="space-y-3 max-w-md">
          <div>
            <label htmlFor="cur-code" className="block text-xs uppercase tracking-wider mb-1" style={{ color: 'var(--text-tertiary)' }}>Current code</label>
            <input id="cur-code" className="input" type="password" autoComplete="current-password" value={current} onChange={e => setCurrent(e.target.value)} />
          </div>
          <div>
            <label htmlFor="new-code" className="block text-xs uppercase tracking-wider mb-1" style={{ color: 'var(--text-tertiary)' }}>New code</label>
            <input id="new-code" className="input" type="password" autoComplete="new-password" value={next} onChange={e => setNext(e.target.value)} />
          </div>
          <div>
            <label htmlFor="conf-code" className="block text-xs uppercase tracking-wider mb-1" style={{ color: 'var(--text-tertiary)' }}>Confirm new code</label>
            <input id="conf-code" className="input" type="password" autoComplete="new-password" value={confirmCode} onChange={e => setConfirmCode(e.target.value)} />
          </div>
          <button type="submit" disabled={busy} className="btn-primary px-6 py-2.5 rounded-xl text-sm">
            {busy ? 'updating…' : 'Update code'}
          </button>
        </form>
      </div>

      <div className="card p-6 space-y-3">
        <h2 className="font-display text-xl" style={{ color: 'var(--primary)' }}>Backup</h2>
        <p className="text-sm" style={{ color: 'var(--text-secondary)' }}>Download a JSON file with all your settings.</p>
        <div>
          <button type="button" onClick={exportData} className="btn-ghost px-5 py-2 rounded-xl text-sm items-center gap-2 inline-flex">
            <Icon name="upload" size={14} className="rotate-180" /> <span>Export JSON</span>
          </button>
        </div>
      </div>

      <div className="card p-6 space-y-3" style={{ borderColor: 'rgba(255, 107, 107, 0.3)' }}>
        <h2 className="font-display text-xl" style={{ color: 'var(--danger)' }}>Danger zone</h2>
        <p className="text-sm" style={{ color: 'var(--text-secondary)' }}>Reset all settings to defaults.</p>
        <button
          type="button"
          onClick={async () => {
            if (!window.confirm('Reset everything to defaults? This cannot be undone.')) return;
            await saveConfig(DEFAULT_CONFIG);
            showToast('Reset complete');
          }}
          className="btn-danger px-5 py-2 rounded-xl text-sm"
        >
          Reset to defaults
        </button>
      </div>
    </div>
  );
}

// ============================================================================
// ERROR BOUNDARY + MOUNT
// ============================================================================
class ErrorBoundary extends React.Component {
  constructor(props) { super(props); this.state = { err: null }; }
  static getDerivedStateFromError(err) { return { err }; }
  componentDidCatch(err, info) { console.error('[gnmc] react crash', err, info); }
  render() {
    if (this.state.err) {
      return (
        <div style={{ padding: 24, color: '#f0f0f5', fontFamily: 'monospace', maxWidth: 720, margin: '40px auto' }}>
          <h1 style={{ color: '#ff6b6b', fontFamily: 'Cinzel, serif', fontSize: 22, marginBottom: 12 }}>Something broke</h1>
          <pre style={{ whiteSpace: 'pre-wrap', fontSize: 12, opacity: 0.85, background: '#14141f', padding: 16, borderRadius: 12, border: '1px solid rgba(255,107,107,0.3)' }}>
            {String(this.state.err && (this.state.err.stack || this.state.err.message || this.state.err))}
          </pre>
          <p style={{ marginTop: 16, opacity: 0.6, fontSize: 12 }}>Open the browser console for more details. Try a hard refresh (Ctrl+Shift+R).</p>
        </div>
      );
    }
    return this.props.children;
  }
}

const rootEl = document.getElementById('root');
rootEl.dataset.mounted = '1';
ReactDOM.createRoot(rootEl).render(
  <ErrorBoundary><App /></ErrorBoundary>
);
  </script>
